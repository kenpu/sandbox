[project]
name = "multimodal-ai"
version = "0.1.0"
description = "A collection of Typer CLI applications"
readme = "README.md"
authors = [
    { name = "Ken Pu", email = "kenpu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "en-core-web-sm",
    "kokoro>=0.9.4",
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "transformers>=5.2.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# A second STT engine (`listen --stt-engine faster-whisper`):
# `uv sync --extra faster-whisper`. ctranslate2 is listed so that the source
# below applies (uv sources only apply to direct dependencies).
faster-whisper = [
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.2",
]

[project.scripts]
main = "multimodal_ai.main:app"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.sources]
# PyPI's ctranslate2 wheels for ARM Linux have no CUDA. On the DGX Spark, use a
# local build with CUDA for the GB10 (how it was built: ~/src/README.md).
# The wheel is for Python 3.13 only. Everything else gets the PyPI wheel
# (x86 Linux wheels include CUDA).
ctranslate2 = [
    { path = "/home/kenpu/src/opt/wheels/ctranslate2-4.8.2-cp313-cp313-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.13'" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
# chatterbox-tts pins torch==2.6.0 / torchaudio==2.6.0 on Python < 3.14 (its own
# metadata allows >=2.9 on 3.14). Override so it shares our torch 2.14 (CUDA 13).
override-dependencies = ["torch>=2.9", "torchaudio>=2.9"]
# resemble-perth (chatterbox's watermarker) imports pkg_resources, which newer
# setuptools no longer ships; without it chatterbox fails to load.
constraint-dependencies = ["setuptools<81"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument in defaults is Typer's intended idiom, not a bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
